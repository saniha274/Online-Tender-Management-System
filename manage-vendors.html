<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Vendors - TMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #6d28d9, transparent 35%),
                radial-gradient(circle at bottom right, #9333ea, transparent 35%),
                #090014;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .title-section h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title-section p {
            color: #c4b5fd;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .table-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(15px);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            text-align: left;
            padding: 16px;
            color: #ddd6fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #f5f3ff;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .approved {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }

        .approve-btn {
            background: #16a34a;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .disabled-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: bold;
        }

        .success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #c4b5fd;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #c4b5fd;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <div class="title-section">
            <h1>Manage Vendors</h1>
            <p>Review and manage vendor registrations.</p>
        </div>

        <a href="/admin-dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </div>

    <div id="message" class="message"></div>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Company</th>
                    <th>Contact Person</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Registered</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="vendorTableBody">

                <tr>
                    <td colspan="8" class="loading">
                        Loading vendors...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

    async function loadVendors() {

        const tableBody =
            document.getElementById("vendorTableBody");

        try {

            const response =
                await fetch("/api/vendors");

            if (!response.ok) {

                throw new Error(
                    "Failed to load vendors."
                );
            }

            const vendors =
                await response.json();

            tableBody.innerHTML = "";

            if (vendors.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty">
                            No vendors have registered yet.
                        </td>
                    </tr>
                `;

                return;
            }

            vendors.forEach(vendor => {

                const row =
                    document.createElement("tr");

                let statusClass = "pending";

                if (
                    vendor.approvalStatus === "APPROVED"
                ) {

                    statusClass = "approved";

                } else if (
                    vendor.approvalStatus === "REJECTED"
                ) {

                    statusClass = "rejected";
                }

                let actions = "";

                if (
                    vendor.approvalStatus === "PENDING"
                ) {

                    actions = `
                        <div class="actions">

                            <button
                                class="action-btn approve-btn"
                                onclick="updateVendor(
                                    ${vendor.id},
                                    'APPROVE'
                                )">
                                Approve
                            </button>

                            <button
                                class="action-btn reject-btn"
                                onclick="updateVendor(
                                    ${vendor.id},
                                    'REJECT'
                                )">
                                Reject
                            </button>

                        </div>
                    `;

                } else {

                    actions = `
                        <button
                            class="action-btn disabled-btn"
                            disabled>
                            No Action
                        </button>
                    `;
                }

                row.innerHTML = `

                    <td>${vendor.id}</td>

                    <td>
                        ${escapeHtml(vendor.companyName)}
                    </td>

                    <td>
                        ${escapeHtml(vendor.contactPerson)}
                    </td>

                    <td>
                        ${escapeHtml(vendor.email)}
                    </td>

                    <td>
                        ${escapeHtml(vendor.phone)}
                    </td>

                    <td>
                        <span class="status ${statusClass}">
                            ${vendor.approvalStatus}
                        </span>
                    </td>

                    <td>
                        ${escapeHtml(vendor.createdAt)}
                    </td>

                    <td>
                        ${actions}
                    </td>

                `;

                tableBody.appendChild(row);
            });

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="8" class="empty">
                        Failed to load vendors.
                    </td>
                </tr>
            `;
        }
    }


    async function updateVendor(
        vendorId,
        action
    ) {

        const actionName =
            action === "APPROVE"
                ? "approve"
                : "reject";

        const confirmed =
            confirm(
                `Are you sure you want to ${actionName} this vendor?`
            );

        if (!confirmed) {
            return;
        }

        try {

            const response =
                await fetch(
                    "/api/vendor/approval",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            `vendorId=${encodeURIComponent(vendorId)}` +
                            `&action=${encodeURIComponent(action)}`
                    }
                );

            const message =
                await response.text();

            if (!response.ok) {

                showMessage(
                    message,
                    "error"
                );

                return;
            }

            showMessage(
                message,
                "success"
            );

            // Reload vendor list
            loadVendors();

        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );
        }
    }


    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;

        setTimeout(() => {

            messageBox.className =
                "message";

        }, 4000);
    }


    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // Load vendors when page opens
    loadVendors();

</script>

</body>

</html>
